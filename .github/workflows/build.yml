name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recompilation:
    name: Recompilation test
    uses: ./.github/workflows/recomp-test.yml

  translator:
    name: Translator (build + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('translator/Translator.sln', '**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json', 'global.json', 'NuGet.config', 'nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore translator/Translator.sln

      - name: Build
        run: dotnet build translator/Translator.sln -c Release --no-restore

      - name: Test
        run: dotnet test translator/Translator.sln -c Release --no-build --verbosity normal

  macos_substrate:
    name: macOS arm64 (configure + substrate tests)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test macOS app dependency packaging
        shell: bash
        run: bash Launcher/macos/test-publish-app.command

      - name: Configure native runtime
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          cmake -S runtime -B build-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DMKW_BUILD_PRODUCTS=OFF
          grep -qx 'CMAKE_OSX_DEPLOYMENT_TARGET:STRING=12.0' \
            build-macos/CMakeCache.txt

      - name: Build macOS portability targets
        shell: bash
        run: |
          cmake --build build-macos --target \
            mkw_platform_paths_tests \
            mkw_runtime_config_tests \
            mkw_nand_save_tests \
            mkw_nand_settings_tests \
            mkw_sc_serial_tests \
            mkw_input_expr_tests \
            mkw_macos_native_compile \
            mkw_macos_context_abi_tests \
            mkw_macos_host_context_tests \
            mkw_macos_guest_flat_memory_tests \
            mkw_macos_external_audio_tests

      - name: Test execution substrate
        shell: bash
        run: ctest --test-dir build-macos --output-on-failure

  switch_substrate:
    name: Switch devkitA64 (configure + audit build)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitA64:latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install host build tools
        shell: bash
        run: |
          apt-get update -q
          apt-get install -qy --no-install-recommends \
            cmake ninja-build patch python3 git protobuf-compiler

      - name: Configure Switch audit runtime
        shell: bash
        run: |
          cmake -S runtime -B build-switch -G Ninja \
            --toolchain "$GITHUB_WORKSPACE/runtime/cmake/SwitchToolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DMKW_BUILD_PRODUCTS=OFF

      - name: Build Switch audit targets
        shell: bash
        run: |
          cmake --build build-switch --target \
            mkw_switch_native_compile \
            mkw_platform_paths_tests \
            mkw_runtime_config_tests \
            mkw_nand_save_tests \
            mkw_nand_settings_tests \
            mkw_sc_serial_tests \
            mkw_input_expr_tests

  switch_launcher:
    name: Switch launcher (devkitA64)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitA64:latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install host build tools
        shell: bash
        run: |
          apt-get update -q
          apt-get install -qy --no-install-recommends \
            cmake ninja-build git python3 python3-pip bison flex meson
          python3 -m pip install --quiet --break-system-packages mako || \
            python3 -m pip install --quiet mako

      - name: Install Switch libraries
        shell: bash
        run: pacman -S --noconfirm --needed switch-curl switch-libzstd switch-bzip2

      - name: Configure launcher
        shell: bash
        run: |
          cmake -S launcher -B build-launcher -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build launcher
        shell: bash
        run: cmake --build build-launcher

      - name: Launcher host tests
        shell: bash
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -I launcher/source \
            launcher/tests/compare_version.cpp -o /tmp/compare_version
          /tmp/compare_version
          g++ -std=c++20 -O2 -Wall -Wextra -I launcher/source \
            launcher/tests/launcher_logic.cpp -o /tmp/launcher_logic
          /tmp/launcher_logic
