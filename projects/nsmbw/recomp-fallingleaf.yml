schema_version: 1
workspace_root: ../..

# Newer: Falling Leaf on New Super Mario Bros. Wii, USA rev 1.
# tools/newer_pack_prelink.py applies the Falling Leaf Riivolution pack offline: the pack's
# memory patches, its Loader.bin at 0x80001800, the prelinked REL and the linked DLCode blob.
project:
  id: nsmbw-fallingleaf-smne01
  display_name: "Newer: Falling Leaf (on USA rev 1)"
  game_id: SMNE01
  region: E
  base_manifest_format: nsmbw-recomp-base-manifest
  base_manifest_stem: nsmbw_base

memory:
  base: 0x80000000
  size: 0x01800000
  sda_base: 0x8042F680
  sda2_base: 0x80433080

inputs:
  dol:
    path: ../game-fallingleaf/main.dol
  rel:
    path: ../game-fallingleaf/nsmbw_linked.rel
    load_address: 0x807684C0

translation:
  entry_points:
    - 0x80004050
    # Riivolution pack: Loader.bin is a text section at low memory, not code in main.dol.
    - 0x80001800
  # MAP.txt plus Falling Leaf's loader and DLCode function starts.
  function_map:
    path: ../game-fallingleaf/MAP.txt
  allow_unsupported_instructions: false

runtime:
  native_registration_root: runtime/src
  native_abi_directories:
    - runtime/src/hle/gx

output:
  root: generated-fallingleaf
  functions: functions
  runtime_config: RuntimeConfig.h
  data_initializer: data_sections_init.cpp
  base_manifest: ../build/base-fallingleaf/nsmbw_base_manifest.json
